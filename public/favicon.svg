<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tulipPetal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#fff9c4" />
      <stop offset="50%" stopColor="#f8bbd0" />
      <stop offset="100%" stopColor="#ce93d8" />
    </linearGradient>
    <linearGradient id="tulipPetalDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#fff9c4" />
      <stop offset="50%" stopColor="#f50057" />
      <stop offset="100%" stopColor="#c51162" />
    </linearGradient>
    <linearGradient id="stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#81c784" />
      <stop offset="100%" stopColor="#2e7d32" />
    </linearGradient>
  </defs>

  <!-- Stem and Leaves -->
  <path d="M50,95 Q50,70 50,40" fill="none" stroke="url(#stem)" stroke-width="6" stroke-linecap="round" />
  <path d="M50,85 C20,70 20,40 45,60" fill="none" stroke="url(#stem)" stroke-width="5" stroke-linecap="round" />
  <path d="M50,75 C80,60 80,35 55,55" fill="none" stroke="url(#stem)" stroke-width="5" stroke-linecap="round" />

  <!-- Back Petals -->
  <path d="M50,60 C25,45 25,10 50,20 C75,10 75,45 50,60 Z" fill="url(#tulipPetalDark)" />
  
  <!-- Front Petals -->
  <path d="M50,60 C15,45 15,10 40,25 C45,30 45,45 50,60 Z" fill="url(#tulipPetal)" />
  <path d="M50,60 C85,45 85,10 60,25 C55,30 55,45 50,60 Z" fill="url(#tulipPetal)" />
  
  <!-- Center Overlap -->
  <path d="M50,60 C40,45 40,20 50,30 C60,20 60,45 50,60 Z" fill="#ff80ab" />
</svg>